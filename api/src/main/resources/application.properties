# Server
server.port=9090

# PostgreSQL
spring.datasource.password=admin123
spring.datasource.username=admin

spring.security.user.name=admin
spring.security.user.password=admin

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/nebula-queue

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# JWT
jwt.secret=MyVeryStrongSecretKeyForJwtAuthThatIs32CharsLong
jwt.expiration=86400000

# App
spring.application.name=nebula-queue-api

# Background worker (PATCH /internal/worker/jobs/.../status via X-Worker-Token)
# Override APP_WORKER_INTERNAL_TOKEN in production.
app.worker.internal-token=${APP_WORKER_INTERNAL_TOKEN:dev-worker-token}

# Optional: create one admin on startup if missing (local / Docker MVP)
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
