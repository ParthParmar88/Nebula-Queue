# Server
server.port=9090

# Document uploads (DocumentService also enforces 10 MB, with a clearer message)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# PostgreSQL
spring.datasource.password=admin123
spring.datasource.username=admin

spring.security.user.name=admin
spring.security.user.password=admin

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/nebula-queue

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
# A stream event that can't be processed is dropped, not redelivered forever
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# JWT
jwt.secret=MyVeryStrongSecretKeyForJwtAuthThatIs32CharsLong
jwt.expiration=86400000

# App
spring.application.name=nebula-queue-api

# AI jobs: how many one user may have queued or running at once (cost control)
app.ai.max-active-jobs-per-user=${APP_AI_MAX_ACTIVE_JOBS_PER_USER:3}

# Jobs PROCESSING with no update for this long are failed (their worker likely died)
app.jobs.stuck-after=${APP_JOBS_STUCK_AFTER:PT10M}
app.jobs.reaper-interval=PT1M

# Background workers (/internal/worker/** via X-Worker-Token)
# Override APP_WORKER_INTERNAL_TOKEN in production.
app.worker.internal-token=${APP_WORKER_INTERNAL_TOKEN:dev-worker-token}

# Optional: create one admin on startup if missing (local / Docker MVP)
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
